upstream web {
    server web:8000;
}

server {
        listen 9000;
        server_name localhost;

        location / {
            include proxy_params;
            proxy_pass http://web;
        }

        location /api/ws/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /static/ {
            alias /app/static/;
            types { text/css css; }
        }
}
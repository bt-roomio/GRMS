[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/dev/null


[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:django]
environment=PROMETHEUS_MULTIPROC_DIR="/prom_mp"
command=/usr/local/bin/gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:8000
directory=/app
stdout_logfile=/var/log/django/gunicorn.log
stderr_logfile=/var/log/django/gunicorn_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
autostart=true
autorestart=true

[program:mq_async]
command=/usr/local/bin/python apps/core/management/commands/mq_async.py
directory=/app
stdout_logfile=/var/log/supervisor/mq-async-stdout.log
stderr_logfile=/var/log/supervisor/mq-async-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
autostart=true
autorestart=true

[program:celery]
environment=PROMETHEUS_MULTIPROC_DIR="/prom_mp"
directory=/app
command=/usr/bin/env IS_CELERY=1 PGAPPNAME=grms-celery /usr/local/bin/celery -A config worker -l info -c 4 --max-tasks-per-child=100
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/celery-stdout.log
stderr_logfile=/var/log/supervisor/celery-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10

[program:celery-beat]
environment=PROMETHEUS_MULTIPROC_DIR="/prom_mp"
command=/usr/local/bin/celery -A config beat --loglevel=warning
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/celery-beat-stdout.log
stderr_logfile=/var/log/supervisor/celery-beat-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10

[program:mews_websocket]
command=/usr/local/bin/python manage.py mews_websocket
directory=/app
stdout_logfile=/var/log/supervisor/mews_websocket-stdout.log
stderr_logfile=/var/log/supervisor/mews_websocket-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
autostart=true
autorestart=true


[program:pms_handler]
command=/usr/local/bin/python manage.py pms_handler
directory=/app
stdout_logfile=/var/log/supervisor/pms_handler-stdout.log
stderr_logfile=/var/log/supervisor/pms_handler-stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
autostart=true
autorestart=true



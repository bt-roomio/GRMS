[dependency-groups]
dev = [
  "django-stubs==5.1.1",
  "django-stubs-ext==5.1.1",
  "mypy-extensions==1.0.0",
  "pathspec==0.12.1",
  "pika-stubs==0.1.3",
  "types-PyYAML==6.0.12.20240917",
  "celery-types==0.23.0",
  "pytest==8.4.0",
  "pytest-asyncio==1.1.0",
  "pytest-django==4.11.1",
  "pre-commit>=4.6.0",
]

[tool.uv]
package = false

[tool.ty.environment]
root = ["apps"]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
extend-select = ["I", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = [
  "main",
  "shuttle",
  "users",
  "core",
  "services",
  "access_manager",
  "fleet",
]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "drf",
  "config",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
drf = ["rest_framework", "rest_framework_simplejwt", "drf_yasg"]
config = ["config"]

[tool.pytest.ini_options]
python_files = "tests.py test_*.py *_tests.py"
asyncio_mode = "auto"
filterwarnings = "ignore::DeprecationWarning"
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-p no:warnings"

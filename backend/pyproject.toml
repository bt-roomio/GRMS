[tool.ty.environment]
root = ["apps"]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
extend-select = ["I", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["main", "shuttle", "users", "core", "services"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "drf",
  "config",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
drf = ["rest_framework", "rest_framework_simplejwt", "drf_yasg"]
config = ["config"]

[tool.pytest.ini_options]
python_files = "tests.py test_*.py *_tests.py"
asyncio_mode = "auto"
filterwarnings = "ignore::DeprecationWarning"
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-p no:warnings"

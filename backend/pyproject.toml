[tool.black]
line-length = 120
target-version = ['py37']
include = '\.pyi?$'
force-exclude = '''(migrations)'''

[tool.pyright]
typeCheckingMode = "standard"
executionEnvironments = [{ root = "apps" }]

reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.isort]
profile = "black"
known_drf = ["rest_framework", "rest_framework_simplejwt", "drf_yasg"]
known_apps = ["main", "shuttle", "users", "core"]
known_config = ["config"]
sections = [
  "FUTURE",
  "STDLIB",
  "THIRDPARTY",
  "DRF",
  "CONFIG",
  "FIRSTPARTY",
  "APPS",
  "LOCALFOLDER",
]
line_length = 120


[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

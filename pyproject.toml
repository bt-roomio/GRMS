[tool.black]
line-length = 120
target-version = ['py37']
include = '\.pyi?$'
force-exclude = '''(migrations)'''

[tool.pyright]
typeCheckingMode = "basic"
executionEnvironments = [{ root = "apps" }]

reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.isort]
profile = "black"
known_drf = ["rest_framework"]
known_apps = ["main", "shuttle", "users", "core"]
known_config = ["config"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DRF", "CONFIG", "FIRSTPARTY", "APPS", "LOCALFOLDER"]
default_section = "THIRDPARTY"
force_sort_within_sections = true
combine_as_imports = true
line_length = 120
no_lines_before = ["CONFIG", "APPS"]


[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]


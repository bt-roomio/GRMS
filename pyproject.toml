[tool.black]
line-length = 120
target-version = ['py37']
include = '\.pyi?$'
force-exclude = '''(migrations)'''

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]
extend-select = ["I"]


[tool.pyright]
executionEnvironments = [{ root = "apps" }]

# Reporting settings
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

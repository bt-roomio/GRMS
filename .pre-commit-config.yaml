repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        exclude: ^\.gitlab-ci\.yml$
      - id: check-yaml
        name: check-yaml (gitlab-ci, allow custom tags)
        args: [--unsafe]
        files: ^\.gitlab-ci\.yml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: debug-statements
      # Detached HEAD in CI has no branch, so this only guards local commits.
      - id: no-commit-to-branch
        args: [--branch, main, --branch, stable]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      # Re-locks when pyproject.toml changed without uv.lock; CI's `uv sync --frozen` would fail otherwise.
      - id: uv-lock
        args: [--project, backend]
        files: ^backend/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Model changes without a migration. Needs the backend venv (`uv sync`); skipped in the
      # CI pre-commit job and run in the test job instead, where the dependencies are installed.
      - id: makemigrations-check
        name: makemigrations --check
        entry: bash -c 'cd backend && uv run ./manage.py makemigrations --check --dry-run'
        language: system
        pass_filenames: false
        files: ^backend/apps/.+/(models|models/.+)\.py$

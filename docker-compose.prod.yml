x-logging: &default-logging
  driver: json-file
  options:
    max-file: 5
    max-size: 50m

x-django-common: &django-common
  image: registry.gitlab.com/yroomio/grms:production
  env-file: .env
  networks:
    - roomio_net
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

# Workers wait for backend (which runs migrations before becoming healthy)
x-worker-depends: &worker-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  backend:
    condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb:2.21.0-pg16
    restart: always
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      - redis-server
      - --appendonly no              # Channels не требует персистентность
      - --save ""                    # Отключить RDB
      - --dbfilename ""              # Не загружать dump.rdb при старте
      - --maxmemory 1gb
      - --maxmemory-policy allkeys-lru
    restart: always
    ports:
      - 6379
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672
      - 8097:5672
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  # --- Django services ---

  backend:
    <<: *django-common
    container_name: django
    hostname: django
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8000), timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    expose:
      - 8000
    environment:
      PROMETHEUS_MULTIPROC_DIR: /prom_mp
      VIRTUAL_HOST: api.cloud.room.io
      LETSENCRYPT_HOST: api.cloud.room.io
      LETSENCRYPT_EMAIL: grms@room.io
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers ${GUNICORN_WORKERS:-4} --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      - prom_mp:/prom_mp

  celery:
    <<: *django-common
    container_name: celery
    logging: *default-logging
    depends_on: *worker-depends
    environment:
      PROMETHEUS_MULTIPROC_DIR: /prom_mp
      IS_CELERY: "1"
      PGAPPNAME: grms-celery
    command: celery -A config worker -l info -c 4 --max-tasks-per-child=100
    volumes:
      - prom_mp:/prom_mp

  celery-beat:
    <<: *django-common
    container_name: celery-beat
    logging: *default-logging
    depends_on: *worker-depends
    environment:
      PROMETHEUS_MULTIPROC_DIR: /prom_mp
    command: celery -A config beat --loglevel=warning
    volumes:
      - prom_mp:/prom_mp

  mq-async:
    <<: *django-common
    container_name: mq-async
    logging: *default-logging
    env_file: .env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    depends_on: *worker-depends
    command: python apps/core/management/commands/mq_async.py
    volumes:
      - prom_mp:/prom_mp

  mews-websocket:
    <<: *django-common
    container_name: mews-websocket
    logging: *default-logging
    depends_on: *worker-depends
    command: python manage.py mews_websocket

  pms-handler:
    <<: *django-common
    container_name: pms-handler
    logging: *default-logging
    depends_on: *worker-depends
    command: python manage.py pms_handler

  # --- Frontend ---

  frontend:
    image: registry.gitlab.com/grms1/grms_front:latest
    container_name: vue
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
      VITE_WS_BASE_URL_V2: ${VITE_WS_BASE_URL_V2}
    command: >
      sh -c "yarn && yarn build && cp -r dist/* /frontend"
    volumes:
      - frontend:/frontend
    networks:
      - roomio_net

  frontend-nginx:
    image: nginx:alpine
    container_name: frontend-nginx
    restart: always
    logging: *default-logging
    expose:
      - 80
    volumes:
      - frontend:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: cloud.room.io
      LETSENCRYPT_HOST: cloud.room.io
      LETSENCRYPT_EMAIL: grms@room.io
      HTTPS_METHOD: noredirect
      HSTS: off
    networks:
      - roomio_net
    depends_on:
      - frontend

  proxy:
    image: jwilder/nginx-proxy:latest
    container_name: proxy
    logging: *default-logging
    volumes:
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - vhost:/etc/nginx/vhost.d
      - certs:/etc/nginx/certs
      - /run/docker.sock:/tmp/docker.sock:ro
      - static_volume:/app/static/
      - media_volume:/app/media/
      - ./nginx/vhost.d:/etc/nginx/vhost.d:ro
    restart: always
    networks:
      - roomio_net
    ports:
      - 80:80
      - 443:443

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: letsencrypt
    logging: *default-logging
    volumes:
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - vhost:/etc/nginx/vhost.d
      - certs:/etc/nginx/certs
      - /run/docker.sock:/var/run/docker.sock:ro
    environment:
      NGINX_PROXY_CONTAINER: proxy
      DEFAULT_EMAIL: grms@room.io
    restart: always
    depends_on:
      - proxy
    networks:
      - roomio_net

  mqtt:
    restart: unless-stopped
    image: registry.gitlab.com/grms1/mqtt-broker:dev
    container_name: mqtt-broker
    hostname: mqtt-broker
    ports:
      - 9000:9999
    command: python MqttTransportHandler.py
    volumes:
      - ./mqtt_logs:/mqtt/logs
    logging: *default-logging
    environment:
      GRMS_PROTOCOL: http
      GRMS_HOST: django
      GRMS_PORT: "8000"
      GRMS_PROTOCOL1: https
      GRMS_HOST1: api.cloud.room.io
      GRMS_PORT1: "443"
      QUEUE_TYPE: rabbitMQ
      QUEUE_HOST: rabbitmq
      QUEUE_PORT: "5672"
      QUEUE_LOGIN: yanis
      QUEUE_PASSWORD: grms
      MAX_LOG_DAYS: "7"
      LOGGING_LEVEL: WARNING
    networks:
      - roomio_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  ndnines:
    image: registry.gitlab.com/grms1/node-red-nodes:new
    container_name: nodered-nines
    expose:
      - "1880"
    environment:
      API_URL: "http://django:8000"
      TENANT_ID: "78061956-4619-4da6-b18a-eb9f39daa500"  # nines@room.io
      LOG_LEVEL: warn  # debug info warn error fatal off
      VIRTUAL_HOST: nodered-nines.cloud.room.io
      VIRTUAL_PORT: 1880
      LETSENCRYPT_HOST: nodered-nines.cloud.room.io
      LETSENCRYPT_EMAIL: bt@room.io
    restart: always
    volumes:
      - nodered-nines:/data
    networks:
      - roomio_net
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s

  ndmap:
    image: registry.gitlab.com/grms1/node-red-nodes:new
    container_name: nodered-map
    ports:
      - "1881:1880"
    environment:
      API_URL: "http://django:8000"
      TENANT_ID: "d972d4f9-16f9-4439-ad5a-2cec4d02b946"  # nines@room.io
      LOG_LEVEL: warn  # debug info warn error fatal off
      VIRTUAL_HOST: mapnodered.cloud.room.io
      VIRTUAL_PORT: 1880
      LETSENCRYPT_HOST: mapnodered.cloud.room.io
      LETSENCRYPT_EMAIL: bt@room.io
      HTTPS_METHOD: noredirect
      HSTS: off
    restart: always
    volumes:
      - nodered-map-new:/data
    networks:
      - roomio_net
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s


  ndol:
    image: registry.gitlab.com/grms1/node-red-nodes:new
    container_name: nodered-olympic-lagoon
    expose:
      - "1880"
    environment:
      API_URL: "http://django:8000"
      TENANT_ID: "e9379274-7e38-40e0-b6b4-89a986e0c96b"  # nines@room.io
      LOG_LEVEL: info  # debug info warn error fatal off
      VIRTUAL_HOST: ol-nodered.cloud.room.io
      VIRTUAL_PORT: 1880
      LETSENCRYPT_HOST: ol-nodered.cloud.room.io
      LETSENCRYPT_EMAIL: bt@room.io
    restart: always
    volumes:
      - nodered-olympic:/data
    networks:
      - roomio_net
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s

volumes:
  static_volume:
  media_volume:
  pg_data:
  frontend:
  rabbitmq:
  certs:
  dhparam:
  vhost:
  html:
  acme:
  prom_mp:
  nodered-nines:
  nodered-map:
  nodered-map-new:
  nodered-olympic:

networks:
  roomio_net:
    name: roomio_net


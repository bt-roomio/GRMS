services:
  postgres:
    image: postgres:16
    restart: always
    container_name: postgres
    env_file:
      - prod.env
    ports:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - roomio_net

  backend:
    image: registry.gitlab.com/yroomio/grms:latest
    container_name: django
    command: >
      /bin/bash -c "
      python /app/manage.py migrate &&
      python /app/manage.py collectstatic --no-input &&
      supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    ports:
      - "8000"
    restart: always
    env_file:
      - prod.env
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    depends_on:
      - postgres
    networks:
      - roomio_net

  frontend:
    image: registry.gitlab.com/grms1/grms_front:latest
    container_name: vue
    env_file:
      - prod.env
    command: >
      sh -c "yarn && yarn build && cp -r dist/* /frontend"
    volumes:
      - frontend:/frontend
    networks:
      - roomio_net

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend:/usr/share/nginx/html
      - static_volume:/app/static/
      - media_volume:/app/media/
    ports:
      - "9000:8080"
      - "8095:80"
    depends_on:
      - backend
      - frontend
    networks:
      - roomio_net

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - roomio_net

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    restart: always
    environment:
      - RABBITMQ_NODENAME=rabbit@rabbitmq
      - RABBITMQ_DEFAULT_USER=yanis
      - RABBITMQ_DEFAULT_PASS=grms
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672
      - 8097:5672
    networks:
      - roomio_net

  mqtt:
    restart: unless-stopped
    image: registry.gitlab.com/grms1/mqtt-broker
    hostname: mqtt-broker
    ports:
      - 9003:9999 # port forwarding
    command: python MqttTransportHandler.py
    volumes:
      - ./mqtt_logs:/mqtt/logs
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"
    environment:
      - GRMS_HOST=vesna.tais.su
      - GRMS_PORT=9000
      - QUEUE_TYPE=rabbitMQ
      - QUEUE_HOST=vesna.tais.su
      - QUEUE_PORT=8097
      - QUEUE_LOGIN=yanis
      - QUEUE_PASSWORD=grms
      - MAX_LOG_DAYS=7
      - LOGGING_LEVEL=DEBUG
    networks:
      - roomio_net
    depends_on:
      - rabbitmq
      - backend

volumes:
  static_volume:
  media_volume:
  pg_data:
  frontend:
  rabbitmq:

networks:
  roomio_net:

services:
  postgres:
    image: postgres:16
    restart: always
    container_name: postgres
    env_file:
      - prod.env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - roomio_net

  backend:
    image: registry.gitlab.com/yroomio/grms:latest
    container_name: django
    hostname: django
    ports:
      - "8000"
    restart: always
    env_file:
      - prod.env
    environment:
      - VIRTUAL_HOST=back.domain.com
      - LETSENCRYPT_HOST=back.domain.com
      - LETSENCRYPT_EMAIL=test@test.com
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
    depends_on:
      - postgres
    networks:
      - roomio_net

  frontend:
    image: registry.gitlab.com/grms1/grms_front:latest
    container_name: vue
    env_file:
      - prod.env
    command: >
      sh -c "yarn && yarn build && cp -r dist/* /frontend"
    volumes:
      - frontend:/frontend
    networks:
      - roomio_net

  frontend-nginx:
    image: nginx:alpine
    container_name: frontend-nginx
    volumes:
      - frontend:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=front.domain.com
      - LETSENCRYPT_HOST=front.domain.com
      - LETSENCRYPT_EMAIL=test@test.com
    networks:
      - roomio_net
    depends_on:
      - frontend

  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - ./nginx/vhost.d:/etc/nginx/vhost.d
    networks:
      - roomio_net
    depends_on:
      - backend
      - frontend-nginx

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-letsencrypt
    restart: always
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy
    networks:
      - roomio_net

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - roomio_net

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq
    env_file:
      - prod.env
    environment:
      - RABBITMQ_NODENAME=rabbit@rabbitmq
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672
      - 8097:5672
    networks:
      - roomio_net

  mqtt:
    restart: unless-stopped
    image: registry.gitlab.com/grms1/mqtt-broker
    container_name: mqtt-broker
    hostname: mqtt-broker
    ports:
      - 9003:9999 # port forwarding
    command: python MqttTransportHandler.py
    volumes:
      - ./mqtt_logs:/mqtt/logs
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"
    environment:
      - GRMS_HOST=django
      - GRMS_PORT=9000
      - QUEUE_TYPE=rabbitMQ
      - QUEUE_HOST=rabbitmq
      - QUEUE_PORT=5672
      - QUEUE_LOGIN=yanis
      - QUEUE_PASSWORD=grms
      - MAX_LOG_DAYS=7
      - LOGGING_LEVEL=DEBUG
    networks:
      - roomio_net
    depends_on:
      - rabbitmq
      - backend

  node-red:
    image: registry.gitlab.com/grms1/node-red-nodes:latest
    ports:
      - "1880:1880"
    environment:
      API_URL: "http://django:8000"
      TENANT_ID: "TENANT_ID"
    restart: always
    volumes:
      - node-red-data:/data
    networks:
      - roomio_net

volumes:
  static_volume:
  media_volume:
  pg_data:
  frontend:
  rabbitmq:
  certs:
  vhost:
  html:
  node-red-data:

networks:
  roomio_net:

stages:
  - test
  - build
  - staging
  - production

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  interruptible: true
  services:
    - name: timescale/timescaledb:2.21.0-pg16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: test_db
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .uv-cache
  before_script:
    - cd backend
    - uv sync --frozen
    - uv run python manage.py migrate
  script:
    - uv run python manage.py test

backend:
  stage: build
  image: docker:git
  interruptible: true
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stable|test_ci_cd)$/
    - when: never
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - |
      if [ "$CI_COMMIT_BRANCH" == "dev" ]; then
        export IMAGE_TAG=dev
      elif [ "$CI_COMMIT_BRANCH" == "test_ci_cd" ]; then
        export IMAGE_TAG=test_ci_cd
      else
        export IMAGE_TAG=latest
      fi
    - docker pull "$CI_REGISTRY_IMAGE:$IMAGE_TAG" || true
    - |
      cd backend && docker build \
        --cache-from "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

# Shared SSH config for deployments through leto jump host
.ssh-via-jumphost:
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$LETO_PRIVATE_KEY" > ~/.ssh/leto && chmod 600 ~/.ssh/leto
    - echo "$ROOMIO_PRIVATE_KEY" > ~/.ssh/roomio && chmod 600 ~/.ssh/roomio
    - ssh-keyscan -p $LETO_PORT $LETO_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - |
      cat > ~/.ssh/config <<EOF
      Host leto
        HostName $LETO_HOST
        User $LETO_USER
        Port $LETO_PORT
        IdentityFile ~/.ssh/leto
        ForwardAgent yes
        StrictHostKeyChecking yes

      Host roomio
        HostName $ROOMIO_HOST
        User $ROOMIO_USER
        Port $ROOMIO_PORT
        IdentityFile ~/.ssh/roomio
        ProxyJump leto
        ForwardAgent yes
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
      EOF
    - chmod 600 ~/.ssh/config

leto-backend:
  stage: staging
  image: alpine:latest
  needs: [backend]
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|test_ci_cd)$/
      when: manual
    - when: never
  script:
    - apk add --no-cache openssh-client
    - echo "$LETO_PRIVATE_KEY" > publickey && chmod 600 publickey
    - ssh -o "StrictHostKeyChecking=no" -i publickey $LETO_USER@$LETO_HOST -p $LETO_PORT "
      cd ~/services;
      echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin;
      docker compose pull backend celery celery-beat mq-async mews-websocket pms-handler &&
      docker compose down backend celery celery-beat mq-async mews-websocket pms-handler proxy &&
      docker compose up -d --no-deps backend celery celery-beat mq-async mews-websocket pms-handler proxy;
      "

leto-frontend:
  stage: staging
  image: alpine:latest
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|test_ci_cd)$/
      when: manual
    - when: never
  script:
    - apk add --no-cache openssh-client
    - echo "$LETO_PRIVATE_KEY" > publickey && chmod 600 publickey
    - ssh -o "StrictHostKeyChecking=no" -i publickey $LETO_USER@$LETO_HOST -p $LETO_PORT "
      cd ~/services;
      echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin;
      docker compose pull frontend &&
      docker compose up frontend &&
      docker restart frontend-nginx;
      "

grms-backend:
  extends: .ssh-via-jumphost
  stage: production
  needs: [backend]
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(stable|test_ci_cd)$/
      when: manual
    - when: never
  script:
    - ssh leto "echo 'Connected to leto successfully'"
    - ssh roomio "echo 'Connected to roomio through leto successfully'"
    - ssh roomio "
      cd ~/GRMS;
      echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin;
      docker compose pull backend celery celery-beat mq-async mews-websocket pms-handler &&
      docker compose down backend celery celery-beat mq-async mews-websocket pms-handler nginx-proxy &&
      docker compose up -d --no-deps backend celery celery-beat mq-async mews-websocket pms-handler nginx-proxy;
      "

grms-frontend:
  extends: .ssh-via-jumphost
  stage: production
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(stable|test_ci_cd)$/
      when: manual
    - when: never
  script:
    - ssh leto "echo 'Connected to leto successfully'"
    - ssh roomio "echo 'Connected to roomio through leto successfully'"
    - ssh roomio "
      cd ~/GRMS;
      echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin;
      docker compose pull frontend &&
      docker compose up frontend &&
      docker restart frontend-nginx;
      "


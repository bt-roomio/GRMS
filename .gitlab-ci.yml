image: docker:git
services:
  - docker:dind

stages:
  - build
  - staging 

variables:
  IMAGE_NAME: registry.gitlab.com/yroomio/grms
  IMAGE_TAG: latest  

build:
  stage: build
  when: manual
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - cd backend && docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG

vesna:
  stage: staging
  when: manual
  image: alpine:latest
  only:
    - dev
  script:
    - apk add --no-cache openssh-client
    - echo "$VESNA_PRIVATE_KEY" >> publickey && chmod 600 publickey
    - ssh -o "StrictHostKeyChecking=no" -i publickey $VESNA_USER@$VESNA_HOST -p $VESNA_PORT "
      mkdir -p ~/GRMS;
      cd ~/GRMS;
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY";
      docker compose pull backend &&
      docker compose down backend nginx &&
      docker compose up backend nginx -d;
      "

leto:
  stage: staging
  when: manual
  image: alpine:latest
  only:
    - dev
  script:
    - apk add --no-cache openssh-client
    - echo "$LETO_PRIVATE_KEY" | base64 -d >> publickey && chmod 600 publickey
    - ssh -o "StrictHostKeyChecking=no" -i publickey $LETO_USER@$LETO_HOST -p $LETO_PORT "
      mkdir -p ~/GRMS;
      cd ~/GRMS;
      mkdir test;"

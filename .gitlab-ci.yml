          "

grms-backend:
    stage: production
    when: manual
    image: alpine:latest
    only:
        - stable
        - test_ci_cd
    before_script:
        - apk update && apk add openssh-client
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - echo "$STROYTEKS_PRIVATE_KEY" > ~/.ssh/stroyteks && chmod 600 ~/.ssh/stroyteks
        - echo "$ROOMIO_PRIVATE_KEY" > ~/.ssh/roomio && chmod 600 ~/.ssh/roomio
        - ssh-keyscan -p $STROYTEKS_PORT $STROYTEKS_HOST >> ~/.ssh/known_hosts
        - chmod 644 ~/.ssh/known_hosts
        - |
            cat > ~/.ssh/config <<EOF
            Host stroyteks
              HostName $STROYTEKS_HOST
              User $STROYTEKS_USER
              Port $STROYTEKS_PORT
              IdentityFile ~/.ssh/stroyteks
              ForwardAgent yes
              StrictHostKeyChecking yes
              
            Host roomio
              HostName $ROOMIO_HOST
              User $ROOMIO_USER
              Port $ROOMIO_PORT
              IdentityFile ~/.ssh/roomio
              ProxyJump stroyteks
              ForwardAgent yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
            EOF
        - chmod 600 ~/.ssh/config
    script:
        - ssh stroyteks "echo 'Connected to stroyteks successfully'"
        - ssh roomio "echo 'Connected to roomio through stroyteks successfully'"
        - ssh roomio "
          cd ~/GRMS;
          echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin;
          docker compose pull backend &&
          docker compose down backend nginx-proxy &&
          docker compose up backend nginx-proxy -d;
          "

grms-frontend:
    stage: production
    when: manual
    image: alpine:latest
    only:
        - stable
        - test_ci_cd
    before_script:
        - apk update && apk add openssh-client
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - echo "$STROYTEKS_PRIVATE_KEY" > ~/.ssh/stroyteks && chmod 600 ~/.ssh/stroyteks
        - echo "$ROOMIO_PRIVATE_KEY" > ~/.ssh/roomio && chmod 600 ~/.ssh/roomio
        - ssh-keyscan -p $STROYTEKS_PORT $STROYTEKS_HOST >> ~/.ssh/known_hosts
        - chmod 644 ~/.ssh/known_hosts
        - |
            cat > ~/.ssh/config <<EOF
            Host stroyteks
              HostName $STROYTEKS_HOST
              User $STROYTEKS_USER
              Port $STROYTEKS_PORT
              IdentityFile ~/.ssh/stroyteks
              ForwardAgent yes
              StrictHostKeyChecking yes

            Host roomio
              HostName $ROOMIO_HOST
              User $ROOMIO_USER
              Port $ROOMIO_PORT
              IdentityFile ~/.ssh/roomio
              ProxyJump stroyteks
              ForwardAgent yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
            EOF
        - chmod 600 ~/.ssh/config
    script:
        - ssh stroyteks "echo 'Connected to stroyteks successfully'"
        - ssh roomio "echo 'Connected to roomio through stroyteks successfully'"
        - ssh roomio "
          cd ~/GRMS;
          echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin;
          docker compose pull frontend &&
          docker compose up frontend &&
          docker restart frontend-nginx;
          "

stages:
  - test
  - build
  - staging
  - production

variables:
  MAKE_ENV: ""

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  interruptible: true
  services:
    - name: timescale/timescaledb:2.21.0-pg16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: test_db
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .uv-cache
  before_script:
    - cd backend
    - uv sync --frozen
    - uv run python manage.py migrate
  script:
    - uv run python manage.py test

backend:
  stage: build
  image: docker:git
  interruptible: true
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stable|test_ci_cd)$/
    - when: never
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - |
      if [ "$CI_COMMIT_BRANCH" == "dev" ]; then
        export IMAGE_TAG=dev
      elif [ "$CI_COMMIT_BRANCH" == "test_ci_cd" ]; then
        export IMAGE_TAG=test_ci_cd
      else
        export IMAGE_TAG=latest
      fi
    - docker pull "$CI_REGISTRY_IMAGE:$IMAGE_TAG" || true
    - |
      cd backend && docker build \
        --cache-from "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"


# ---------------------------------------------------------------------------
# Shared SSH connection templates
# ---------------------------------------------------------------------------

# Used by grms-* jobs: connects to roomio through the leto jump host.

.ssh-via-jumphost:
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$LETO_PRIVATE_KEY" > ~/.ssh/leto && chmod 600 ~/.ssh/leto
    - echo "$ROOMIO_PRIVATE_KEY" > ~/.ssh/roomio && chmod 600 ~/.ssh/roomio
    - ssh-keyscan -p $LETO_PORT $LETO_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - |
      cat > ~/.ssh/config <<EOF
      Host leto
        HostName $LETO_HOST
        User $LETO_USER
        Port $LETO_PORT
        IdentityFile ~/.ssh/leto
        ForwardAgent yes
        StrictHostKeyChecking yes

      Host roomio
        HostName $ROOMIO_HOST
        User $ROOMIO_USER
        Port $ROOMIO_PORT
        IdentityFile ~/.ssh/roomio
        ProxyJump leto
        ForwardAgent yes
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
      EOF
    - chmod 600 ~/.ssh/config

# Used by leto-* and cloud-* jobs: connects directly to a single host via key.
# Sets up an SSH config alias ("deploy-target") so the shared deploy script
# fragments below can use the same `ssh $SSH_TARGET "..."` invocation that
# the jump-host jobs use.

.ssh-direct:
  image: alpine:latest
  variables:
    SSH_TARGET: deploy-target
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - |
      cat > ~/.ssh/config <<EOF
      Host deploy-target
        HostName $SSH_HOST
        User $SSH_USER
        Port $SSH_PORT
        IdentityFile ~/.ssh/deploy_key
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
      EOF
    - chmod 600 ~/.ssh/config

# ---------------------------------------------------------------------------
# Shared deploy script fragments (reused via `extends` or `!reference`)
#
# Actual service management (which containers, pull/restart order, proxy
# reload) lives in deploy/Makefile — CI only logs in to the registry and
# invokes the relevant `make` target on the remote host.
# ---------------------------------------------------------------------------

.backend-deploy:
  script:
    - ssh $SSH_TARGET "
      cd $REMOTE_DIR;
      echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin;
      make $MAKE_ENV deploy-backend
      "

.frontend-deploy:
  script:
    - ssh $SSH_TARGET "
      cd $REMOTE_DIR;
      echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin;
      make $MAKE_ENV deploy-frontend
      "

# ---------------------------------------------------------------------------
# Staging (leto / dev)
# ---------------------------------------------------------------------------

leto-backend:
  extends: [.ssh-direct, .backend-deploy]
  stage: staging
  needs: [backend]
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|test_ci_cd)$/
      when: manual
    - when: never
  variables:
    SSH_PRIVATE_KEY: $LETO_PRIVATE_KEY
    SSH_HOST: $LETO_HOST
    SSH_PORT: $LETO_PORT
    SSH_USER: $LETO_USER
    REMOTE_DIR: ~/GRMS/deploy

leto-frontend:
  extends: [.ssh-direct, .frontend-deploy]
  stage: staging
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|test_ci_cd)$/
      when: manual
    - when: never
  variables:
    SSH_PRIVATE_KEY: $LETO_PRIVATE_KEY
    SSH_HOST: $LETO_HOST
    SSH_PORT: $LETO_PORT
    SSH_USER: $LETO_USER
    REMOTE_DIR: ~/GRMS/deploy
    MAKE_ENV: "ENV=prod"

# ---------------------------------------------------------------------------
# Production (roomio, via leto jump host)
# ---------------------------------------------------------------------------

grms-backend:
  extends: .ssh-via-jumphost
  stage: production
  needs: [backend]
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(stable|test_ci_cd)$/
      when: manual
    - when: never
  variables:
    SSH_TARGET: roomio
    REMOTE_DIR: ~/GRMS/deploy
    MAKE_ENV: "ENV=prod"
  script:
    - ssh leto "echo 'Connected to leto successfully'"
    - ssh roomio "echo 'Connected to roomio through leto successfully'"
    - !reference [.backend-deploy, script]

grms-frontend:
  extends: .ssh-via-jumphost
  stage: production
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(stable|test_ci_cd)$/
      when: manual
    - when: never
  variables:
    SSH_TARGET: roomio
    REMOTE_DIR: ~/GRMS/deploy
    MAKE_ENV: "ENV=prod"
  script:
    - ssh leto "echo 'Connected to leto successfully'"
    - ssh roomio "echo 'Connected to roomio through leto successfully'"
    - !reference [.frontend-deploy, script]

# ---------------------------------------------------------------------------
# Production (cloud)
# ---------------------------------------------------------------------------

cloud-backend:
  extends: [.ssh-direct, .backend-deploy]
  stage: production
  needs: [backend]
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(stable|test_ci_cd)$/
      when: manual
    - when: never
  variables:
    SSH_PRIVATE_KEY: $CLOUD_PRIVATE_KEY
    SSH_HOST: $CLOUD_HOST
    SSH_PORT: $CLOUD_PORT
    SSH_USER: $CLOUD_USER
    REMOTE_DIR: ~/GRMS/deploy
    MAKE_ENV: "ENV=prod"

cloud-frontend:
  extends: [.ssh-direct, .frontend-deploy]
  stage: production
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(stable|test_ci_cd)$/
      when: manual
    - when: never
  variables:
    SSH_PRIVATE_KEY: $CLOUD_PRIVATE_KEY
    SSH_HOST: $CLOUD_HOST
    SSH_PORT: $CLOUD_PORT
    SSH_USER: $CLOUD_USER
    REMOTE_DIR: ~/GRMS/deploy
    MAKE_ENV: "ENV=prod"

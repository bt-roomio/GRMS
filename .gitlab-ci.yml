image: docker:git
services:
    - docker:dind

stages:
    - test
    - build
    - deploy
    - production

test:
    stage: test
    image: python:3.12-slim
    services:
        - name: timescale/timescaledb:2.21.0-pg16
          alias: postgres
        - name: redis:7-alpine
          alias: redis
    variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: test_db
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        REDIS_HOST: redis
        REDIS_PORT: 6379
    before_script:
        - cd backend
        - pip install -r requirements.txt
        - python manage.py migrate
    script:
        - python manage.py test

backend:
    stage: build
    only:
        - dev
        - stable
        - test_ci_cd
    script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
        - |
            if [ "$CI_COMMIT_BRANCH" == "dev" ]; then
              export IMAGE_TAG=dev
            else
              export IMAGE_TAG=latest
            fi
        - cd backend && docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
        - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG

vesna-backend:
    stage: deploy
    when: manual
    image: alpine:latest
    only:
        - dev
        - test_ci_cd
    script:
        - apk add --no-cache openssh-client
        - echo "$VESNA_PRIVATE_KEY" >> publickey && chmod 600 publickey
        - ssh -o "StrictHostKeyChecking=no" -i publickey $VESNA_USER@$VESNA_HOST -p $VESNA_PORT "
          cd ~/GRMS;
          echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin;
          docker compose pull backend &&
          docker compose down backend nginx &&
          docker compose up backend nginx -d;
          "

vesna-frontend:
    stage: deploy
    when: manual
    image: alpine:latest
    only:
        - dev
        - test_ci_cd
    script:
        - apk add --no-cache openssh-client
        - echo "$VESNA_PRIVATE_KEY" >> publickey && chmod 600 publickey
        - ssh -o "StrictHostKeyChecking=no" -i publickey $VESNA_USER@$VESNA_HOST -p $VESNA_PORT "
          cd ~/GRMS;
          echo "$CI_DEPLOY_PASSWORD" | docker login $CI_REGISTRY -u $CI_DEPLOY_USER --password-stdin;
          docker compose pull frontend &&
          docker compose up frontend -d &&
          docker restart nginx;
          "

leto-backend:
    stage: deploy
    when: manual
    image: alpine:latest
    only:
        - dev
        - test_ci_cd
    script:
        - apk add --no-cache openssh-client
        - echo "$LETO_PRIVATE_KEY" >> publickey && chmod 600 publickey
        - ssh -o "StrictHostKeyChecking=no" -i publickey $LETO_USER@$LETO_HOST -p $LETO_PORT "
          mkdir -p ~/GRMS;
          cd ~/GRMS;

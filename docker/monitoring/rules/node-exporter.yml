groups:
- name: system_alerts
  rules:
    - alert: HostHighCpuLoad
      expr: |
        100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 10m
      labels:
        severity: warning
        team: infrastructure
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is {{ printf \"%.2f\" $value }}% (threshold: 80%)"

    - alert: HostOutOfMemory
      expr: |
        (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
      for: 5m
      labels:
        severity: critical
        team: infrastructure
      annotations:
        summary: "Host {{ $labels.instance }} is running out of memory"
        description: "Only {{ printf \"%.2f\" $value }}% memory available"

    - alert: HostOutOfDiskSpace
      expr: |
        (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) < 0.1
      for: 5m
      labels:
        severity: critical
        team: infrastructure
        page: true
      annotations:
        summary: "Host {{ $labels.instance }} is running out of disk space"
        description: "Disk {{ $labels.mountpoint }} has only {{ printf \"%.2f\" $value }}% space left"

    - alert: HostDiskWillFillIn24Hours
      expr: |
        predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"}[6h], 24*3600) < 0
      for: 1h
      labels:
        severity: warning
        team: infrastructure
      annotations:
        summary: "Host {{ $labels.instance }} disk will fill in 24 hours"
        description: "Disk {{ $labels.mountpoint }} will run out of space within 24 hours at current usage rate"




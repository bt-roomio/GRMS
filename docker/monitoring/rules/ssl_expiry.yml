groups:
  - name: ssl-expiry
    rules:
      - alert: TLSCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 25*24*3600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "TLS скоро истечёт ({{ $labels.instance }})"
          description: >-
            Сертификат истекает
            {{- $ts := query (printf "probe_ssl_earliest_cert_expiry{instance=%q}" $labels.instance) -}}
            {{- with $s := first $ts -}}
              {{ humanizeTimestamp (value $s) }}
            {{- end -}}
            (осталось ~
            {{- $dl := query (printf "(probe_ssl_earliest_cert_expiry{instance=%q} - time())/86400" $labels.instance) -}}
            {{- with $d := first $dl -}}
              {{ printf "%.1f" (value $d) }}
            {{- end -}} дн.).

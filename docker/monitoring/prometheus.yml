# prometheus.yml - Updated configuration
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'django'
    static_configs:
      - targets: ['django:8000']  # host.docker.internal:8000
    scrape_interval: 30s
    scrape_timeout: 5s
    sample_limit: 50000
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(offline_gateway_.*|django_.*|python_.*|up)'
        action: keep


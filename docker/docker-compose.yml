x-django-common: &django-common
  image: registry.gitlab.com/yroomio/grms:dev
  env_file: .env
  networks:
    - roomio_net
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb:2.21.0-pg16
    restart: always
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - roomio_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --tcp-keepalive 300
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - roomio_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=rabbit@rabbitmq
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672
      - 8097:5672
    networks:
      - roomio_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - SERVER_IDLE_TIMEOUT=600
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - AUTH_TYPE=scram-sha-256
    networks:
      - roomio_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Django services ---

  migrate:
    <<: *django-common
    container_name: migrate
    restart: "no"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=pgbouncer
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput"
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/

  backend:
    <<: *django-common
    container_name: django
    hostname: django
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - VIRTUAL_HOST=api.domain.com
      - LETSENCRYPT_HOST=api.domain.com
      - LETSENCRYPT_EMAIL=grms@room.io
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      - prom_mp:/prom_mp

  celery-critical:
    <<: *django-common
    container_name: celery-critical
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-critical
    command: celery -A config worker -Q critical -l warning -c 2 --max-tasks-per-child=50
    volumes:
      - prom_mp:/prom_mp

  celery-default:
    <<: *django-common
    container_name: celery-default
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-default
    command: celery -A config worker -Q default -l warning -c 4 --max-tasks-per-child=100
    volumes:
      - prom_mp:/prom_mp

  celery-low:
    <<: *django-common
    container_name: celery-low
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-low
    command: celery -A config worker -Q low -l warning -c 1 --max-tasks-per-child=50
    volumes:
      - prom_mp:/prom_mp

  celery-beat:
    <<: *django-common
    container_name: celery-beat
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-beat
    command: celery -A config beat --loglevel=warning
    volumes:
      - prom_mp:/prom_mp

  mq-async:
    <<: *django-common
    container_name: mq-async
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python apps/core/management/commands/mq_async.py
    volumes:
      - prom_mp:/prom_mp

  mews-websocket:
    <<: *django-common
    container_name: mews-websocket
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python manage.py mews_websocket
    volumes:
      - prom_mp:/prom_mp

  pms-handler:
    <<: *django-common
    container_name: pms-handler
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python manage.py pms_handler
    volumes:
      - prom_mp:/prom_mp

  # --- Frontend ---

  frontend:
    image: registry.gitlab.com/grms1/grms_front:latest
    container_name: vue
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL}
      - VITE_WS_BASE_URL_V2=${VITE_WS_BASE_URL_V2}
    command: >
      sh -c "yarn && yarn build && cp -r dist/* /frontend"
    volumes:
      - frontend:/frontend
    networks:
      - roomio_net

  frontend-nginx:
    image: nginx:alpine
    container_name: frontend-nginx
    restart: always
    expose:
      - "80"
    volumes:
      - frontend:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=domain.com
      - LETSENCRYPT_HOST=domain.com
      - LETSENCRYPT_EMAIL=grms@room.io
    networks:
      - roomio_net
    depends_on:
      - frontend

  proxy:
    image: "jwilder/nginx-proxy:latest"
    container_name: "proxy"
    volumes:
      - "html:/usr/share/nginx/html"
      - "dhparam:/etc/nginx/dhparam"
      - "vhost:/etc/nginx/vhost.d"
      - "certs:/etc/nginx/certs"
      - "/run/docker.sock:/tmp/docker.sock:ro"
      - "static_volume:/app/static/"
      - "media_volume:/app/media/"
      - "./nginx/vhost.d:/etc/nginx/vhost.d:ro"
    restart: "always"
    networks:
      - "roomio_net"
    ports:
      - "80:80"
      - "443:443"

  letsencrypt:
    image: "jrcs/letsencrypt-nginx-proxy-companion:latest"
    container_name: "letsencrypt"
    volumes:
      - "html:/usr/share/nginx/html"
      - "dhparam:/etc/nginx/dhparam"
      - "vhost:/etc/nginx/vhost.d"
      - "certs:/etc/nginx/certs"
      - "/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      NGINX_PROXY_CONTAINER: "proxy"
      DEFAULT_EMAIL: "grms@room.io"
    restart: "always"
    depends_on:
      - "proxy"
    networks:
      - "roomio_net"

  mqtt:
    restart: unless-stopped
    image: registry.gitlab.com/grms1/mqtt-broker
    container_name: mqtt-broker
    hostname: mqtt-broker
    ports:
      - 9000:9999
    command: python MqttTransportHandler.py
    volumes:
      - ./mqtt_logs:/mqtt/logs
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "50m"
    environment:
      - GRMS_PROTOCOL=http
      - GRMS_HOST=django
      - GRMS_PORT=8000
      - GRMS_PROTOCOL1=https
      - GRMS_HOST1=api.leto.tais.su
      - GRMS_PORT1=443
      - QUEUE_TYPE=rabbitMQ
      - QUEUE_HOST=rabbitmq
      - QUEUE_PORT=5672
      - QUEUE_LOGIN=yanis
      - QUEUE_PASSWORD=grms
      - MAX_LOG_DAYS=7
      - LOGGING_LEVEL=INFO
    networks:
      - roomio_net
    depends_on:
      - rabbitmq
      - backend

  nodered:
    image: registry.gitlab.com/grms1/node-red-nodes:latest
    container_name: nodered
    ports:
      - "1880:1880"
    environment:
      - VIRTUAL_HOST=nodered.domain.com
      - VIRTUAL_PORT=1880
      - LETSENCRYPT_HOST=nodered.domain.com
      - LETSENCRYPT_EMAIL=grms@room.io
      - API_URL=http://django:8000
      - TENANT_ID=TENANT_ID
    restart: always
    volumes:
      - nodered:/data
    networks:
      - roomio_net
    profiles: ["nodered"]
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s

volumes:
  static_volume:
  media_volume:
  pg_data:
  redis_data:
  frontend:
  rabbitmq:
  certs:
  dhparam:
  vhost:
  html:
  nodered:
  prom_mp:

networks:
  roomio_net:
    name: roomio_net

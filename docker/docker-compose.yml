x-logging: &default-logging
  driver: json-file
  options:
    max-file: 5
    max-size: 50m

x-worker-depends: &worker-depends
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  backend:
    condition: service_healthy

x-django-common: &django-common
  image: registry.gitlab.com/yroomio/grms:dev
  env_file: .env
  environment:
    - UV_NO_SYNC=1
  networks:
    - roomio_net
  restart: always
  logging: *default-logging
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb:2.21.0-pg16
    restart: always
    container_name: postgres
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: [core]
    command:
      - redis-server
      - --appendonly no
      - --save ""
      - --maxmemory 512mb
      - --maxmemory-policy volatile-lru
    restart: always
    ports:
      - 6379:6379
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    profiles: [core]
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - 15672:15672
      - 8097:5672
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    profiles: [core]
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER}
      STATS_USERS: ${POSTGRES_USER}
    networks:
      - roomio_net
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Django services ---

  backend:
    <<: *django-common
    container_name: django
    hostname: django
    profiles: [back]
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8000), timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    expose:
      - 8000
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - VIRTUAL_HOST=api.domain.com
      - LETSENCRYPT_HOST=api.domain.com
      - LETSENCRYPT_EMAIL=grms@room.io
    command: ["/app/entrypoint.sh"]
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      - prom_mp:/prom_mp

  celery-critical:
    <<: *django-common
    container_name: celery-critical
    profiles: [worker]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-critical
    command: celery -A config worker -Q critical -l warning -c 2 --max-tasks-per-child=50
    volumes:
      - prom_mp:/prom_mp

  celery-default:
    <<: *django-common
    container_name: celery-default
    profiles: [worker]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-default
    command: celery -A config worker -Q default -l warning -c 4 --max-tasks-per-child=100
    volumes:
      - prom_mp:/prom_mp

  celery-low:
    <<: *django-common
    container_name: celery-low
    profiles: [worker]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-low
    command: celery -A config worker -Q low -l warning -c 1 --max-tasks-per-child=50
    volumes:
      - prom_mp:/prom_mp

  celery-beat:
    <<: *django-common
    container_name: celery-beat
    profiles: [worker]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - IS_CELERY=1
      - PGAPPNAME=grms-celery-beat
    command: celery -A config beat --loglevel=warning
    volumes:
      - prom_mp:/prom_mp

  mq-async:
    <<: *django-common
    profiles: [worker]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python apps/core/management/commands/mq_async.py
    volumes:
      - prom_mp:/prom_mp
    deploy:
      replicas: 2

  mews-websocket:
    <<: *django-common
    container_name: mews-websocket
    profiles: [mews]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python manage.py mews_websocket
    volumes:
      - prom_mp:/prom_mp

  pms-handler:
    <<: *django-common
    container_name: pms-handler
    profiles: [pms]
    depends_on: *worker-depends
    environment:
      - POSTGRES_HOST=pgbouncer
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python manage.py pms_handler
    volumes:
      - prom_mp:/prom_mp

  # --- Frontend ---

  frontend:
    image: registry.gitlab.com/grms1/grms_front:latest
    container_name: vue
    profiles: [front]
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL}
      - VITE_WS_BASE_URL_V2=${VITE_WS_BASE_URL_V2}
    command: >
      sh -c "yarn && yarn build && cp -r dist/* /frontend"
    volumes:
      - frontend:/frontend
    networks:
      - roomio_net

  frontend-nginx:
    image: nginx:alpine
    container_name: frontend-nginx
    profiles: [front]
    restart: always
    logging: *default-logging
    expose:
      - "80"
    volumes:
      - frontend:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=domain.com
      - LETSENCRYPT_HOST=domain.com
      - LETSENCRYPT_EMAIL=grms@room.io
    networks:
      - roomio_net
    depends_on:
      - frontend

  proxy:
    image: nginxproxy/nginx-proxy:1.7
    container_name: proxy
    profiles: [proxy]
    logging: *default-logging
    volumes:
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - vhost:/etc/nginx/vhost.d
      - certs:/etc/nginx/certs
      - /run/docker.sock:/tmp/docker.sock:ro
      - static_volume:/app/static/
      - media_volume:/app/media/
      - ./nginx/vhost.d:/etc/nginx/vhost.d:ro
    restart: always
    networks:
      - roomio_net
    ports:
      - "80:80"
      - "443:443"

  letsencrypt:
    image: nginxproxy/acme-companion:2.5
    container_name: letsencrypt
    profiles: [proxy]
    logging: *default-logging
    volumes:
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - vhost:/etc/nginx/vhost.d
      - certs:/etc/nginx/certs
      - acme:/etc/acme.sh
      - /run/docker.sock:/var/run/docker.sock:ro
    environment:
      NGINX_PROXY_CONTAINER: proxy
      DEFAULT_EMAIL: grms@room.io
    restart: always
    depends_on:
      - proxy
    networks:
      - roomio_net

  mqtt:
    restart: unless-stopped
    image: registry.gitlab.com/grms1/mqtt-broker
    container_name: mqtt-broker
    profiles: [mqtt]
    hostname: mqtt-broker
    ports:
      - 9000:9999
    command: python MqttTransportHandler.py
    volumes:
      - ./mqtt_logs:/mqtt/logs
    logging: *default-logging
    environment:
      GRMS_PROTOCOL: http
      GRMS_HOST: django
      GRMS_PORT: "8000"
      GRMS_PROTOCOL1: https
      GRMS_HOST1: api.leto.tais.su
      GRMS_PORT1: "443"
      QUEUE_TYPE: rabbitMQ
      QUEUE_HOST: rabbitmq
      QUEUE_PORT: "5672"
      QUEUE_LOGIN: yanis
      QUEUE_PASSWORD: grms
      MAX_LOG_DAYS: "7"
      LOGGING_LEVEL: INFO
    networks:
      - roomio_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  nodered:
    image: registry.gitlab.com/grms1/node-red-nodes:latest
    container_name: nodered
    profiles: [nodered]
    logging: *default-logging
    ports:
      - "1880:1880"
    environment:
      - VIRTUAL_HOST=nodered.domain.com
      - VIRTUAL_PORT=1880
      - LETSENCRYPT_HOST=nodered.domain.com
      - LETSENCRYPT_EMAIL=grms@room.io
      - API_URL=http://django:8000
      - TENANT_ID=TENANT_ID
    restart: always
    volumes:
      - nodered:/data
    networks:
      - roomio_net
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s

volumes:
  static_volume:
  media_volume:
  pg_data:
  frontend:
  rabbitmq:
  certs:
  dhparam:
  vhost:
  html:
  acme:
  nodered:
  prom_mp:

networks:
  roomio_net:
    name: roomio_net

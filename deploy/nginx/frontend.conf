server {
    listen 80;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    sendfile   on;
    tcp_nopush on;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Статические ассеты — долгий кэш (Vite добавляет хэш в имя файла)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Vue Router — всё на index.html
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control        "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options      "SAMEORIGIN";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

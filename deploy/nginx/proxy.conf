# Replaces nginx-proxy's built-in proxy settings (its template includes this file
# at http level instead of its defaults when /etc/nginx/proxy.conf exists).
#
# The first block is nginx-proxy 1.11's default, kept verbatim; only
# X-Request-ID is ours. Keep proxy_set_header out of vhost.d/<host> files: one
# proxy_set_header at server/location level drops every header set here.

# HTTP 1.1 support
proxy_http_version 1.1;
proxy_set_header Host $host$host_port;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $proxy_connection;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_x_forwarded_for;
proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
proxy_set_header X-Forwarded-Ssl $proxy_x_forwarded_ssl;
proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
proxy_set_header X-Original-URI $request_uri;

# Mitigate httpoxy attack (see nginx-proxy README for details)
proxy_set_header Proxy "";

# Request id shared by the nginx access log (LOG_FORMAT on the proxy service)
# and the backend logs. A well-formed inbound X-Request-ID (same rule as
# core.log.context.clean_request_id) is kept, so an id set by a client or an
# upstream proxy survives; anything else gets nginx's own $request_id.
map $http_x_request_id $grms_request_id {
    "~^[A-Za-z0-9._-]{1,64}$"  $http_x_request_id;
    default                   $request_id;
}

proxy_set_header X-Request-ID $grms_request_id;

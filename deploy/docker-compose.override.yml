# =============================================================================
# docker-compose.override.yml: local development
# =============================================================================
# Applied AUTOMATICALLY on `docker compose up` (without flags).
# DO NOT commit secrets: use .env.local
#
# What this file adds:
#   - Open ports for direct access to services
#   - Bind-mounted code for hot reload
#   - Disabled extra services (proxy, letsencrypt)
#   - Simplified healthchecks (faster startup)
#   - More verbose logs
# =============================================================================

services:

  # --- Postgres: exposed directly for local tools ---
  postgres:
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"

  # --- PgBouncer: exposed for diagnostics (listens on 5432 inside) ---
  pgbouncer:
    ports:
      - "${PGBOUNCER_EXTERNAL_PORT:-6432}:5432"

  # --- Redis: exposed for redis-insight / redis-cli ---
  redis:
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"

  redis-broker:
    ports:
      - "${REDIS_BROKER_EXTERNAL_PORT:-6380}:6379"

  # --- RabbitMQ management UI ---
  rabbitmq:
    ports:
      - "15672:15672"
      - "5672:5672"

  # --- Django: bind-mounted code + verbose logs + dev server ---
  backend:
    volumes:
      - ../backend:/app
      - /app/.venv
      - static_volume:/app/static/
      - media_volume:/app/media/
      - ${FLEET_SSH_KEY_PATH:-/etc/roomio/fleet_key}:/etc/roomio/fleet_key:ro
    ports:
      - "8000:8000"
    environment:
      - UV_NO_SYNC=1
      - PGAPPNAME=grms-backend-dev
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - CELERY_BROKER_URL=redis://redis-broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-broker:6379/1
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8000), timeout=3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- Celery: verbose logs in dev ---
  celery-critical:
    volumes:
      - ../backend:/app
      - /app/.venv
    command: celery -A config worker -Q critical -n critical@%h -c 1

  celery-default:
    volumes:
      - ../backend:/app
      - /app/.venv
    command: celery -A config worker -Q default -n default@%h -c 2

  celery-realtime:
    volumes:
      - ../backend:/app
      - /app/.venv
    command: celery -A config worker -Q realtime -n realtime@%h -c 2

  celery-low:
    volumes:
      - ../backend:/app
      - /app/.venv
    command: celery -A config worker -Q low -n low@%h -c 1

  celery-beat:
    volumes:
      - ../backend:/app
      - /app/.venv
    command: celery -A config beat

  celery-flower:
    volumes:
      - ../backend:/app
      - /app/.venv

  mq-async:
    volumes:
      - ../backend:/app
      - /app/.venv
    deploy:
      replicas: 1

  mews-websocket:
    volumes:
      - ../backend:/app
      - /app/.venv

  pms-handler:
    volumes:
      - ../backend:/app
      - /app/.venv

  # --- Frontend: dev server with hot reload instead of a build ---
  frontend:
    command: sh -c "yarn && yarn dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    # the healthcheck from docker-compose.yml checks :80/healthz, but the Vite dev server
    # listens on :5173 and doesn't serve /healthz, so it is disabled in dev
    healthcheck:
      test: ["NONE"]

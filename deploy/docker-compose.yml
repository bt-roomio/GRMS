# =============================================================================
# roomio GRMS — docker-compose.yml
# =============================================================================
# Группы сервисов (используются в Makefile):
#   infra     — postgres, pgbouncer, redis, redis-broker, rabbitmq
#   app       — backend (django), celery-*, mq-async, mews-websocket, pms-handler
#   iot       — mqtt
#   front     — frontend
#   proxy     — proxy, letsencrypt
#
# Запуск:
#   make up-infra       # только инфраструктура
#   make up-app         # инфра + приложение
#   make up-all         # всё
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: "50m"

# --- A common anchor for all Django services ---
x-django-common: &django-common
  image: registry.gitlab.com/yroomio/grms:${BACKEND_IMAGE_TAG:-dev}
  env_file: .env
  environment:
    - UV_NO_SYNC=1
  networks:
    - roomio_net
  restart: always
  logging: *default-logging
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-worker-depends: &worker-depends
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy
  redis-broker:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  backend:
    condition: service_healthy

x-celery-env: &celery-env
  PROMETHEUS_MULTIPROC_DIR: /prom_mp
  IS_CELERY: "1"
  CELERY_BROKER_URL: redis://redis-broker:6379/0
  CELERY_RESULT_BACKEND: redis://redis-broker:6379/1

x-celery-volumes: &celery-volumes
  []

# =============================================================================
# SERVICES
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # INFRA
  # ---------------------------------------------------------------------------

  postgres:
    image: timescale/timescaledb:2.21.0-pg16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: pgbouncer
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER}
      STATS_USERS: ${POSTGRES_USER}
    networks:
      - roomio_net
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command:
      - redis-server
      - --appendonly no
      - --save ""
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 3

  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    restart: always
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 3G
      - --maxmemory-policy noeviction
    volumes:
      - redis_broker_data:/data
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS:-}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "5672"
    networks:
      - roomio_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # APP (Django + Celery workers)
  # ---------------------------------------------------------------------------

  backend:
    <<: *django-common
    container_name: django
    hostname: django
    expose:
      - "8000"
    environment:
      - UV_NO_SYNC=1
      - PGAPPNAME=grms-backend
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - CELERY_BROKER_URL=redis://redis-broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-broker:6379/1
      - VIRTUAL_HOST=${API_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${API_VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    command: ["/app/entrypoint.sh"]
    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/
      - prom_mp:/prom_mp
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 8000), timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery-critical:
    <<: *django-common
    container_name: celery-critical
    depends_on: *worker-depends
    environment:
      <<: *celery-env
      PGAPPNAME: grms-celery-critical
    command: celery -A config worker -Q critical -n critical@%h -l warning -c 2 --max-tasks-per-child=50
    tmpfs:
      - /prom_mp
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d critical@$$(hostname) -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-default:
    <<: *django-common
    container_name: celery-default
    depends_on: *worker-depends
    environment:
      <<: *celery-env
      PGAPPNAME: grms-celery-default
    command: celery -A config worker -Q default -n default@%h -l warning -c 8 --max-tasks-per-child=100
    tmpfs:
      - /prom_mp
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d default@$$(hostname) -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-realtime:
    <<: *django-common
    container_name: celery-realtime
    depends_on: *worker-depends
    environment:
      <<: *celery-env
      PGAPPNAME: grms-celery-realtime
    command: celery -A config worker -Q realtime -n realtime@%h -l warning -c 4 --max-tasks-per-child=200
    tmpfs:
      - /prom_mp
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d realtime@$$(hostname) -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-low:
    <<: *django-common
    container_name: celery-low
    depends_on: *worker-depends
    environment:
      <<: *celery-env
      PGAPPNAME: grms-celery-low
    command: celery -A config worker -Q low -n low@%h -l warning -c 1 --max-tasks-per-child=50
    tmpfs:
      - /prom_mp
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d low@$$(hostname) -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-beat:
    <<: *django-common
    container_name: celery-beat
    depends_on: *worker-depends
    environment:
      <<: *celery-env
      PGAPPNAME: grms-celery-beat
    command: celery -A config beat --loglevel=warning
    tmpfs:
      - /prom_mp

  celery-flower:
    <<: *django-common
    container_name: celery-flower
    depends_on: *worker-depends
    environment:
      <<: *celery-env
      PGAPPNAME: grms-celery-flower
    command: celery -A config flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH must be set (user:password)}
    ports:
      - "127.0.0.1:5555:5555"
    tmpfs:
      - /prom_mp

  # Перезапускает контейнеры со статусом unhealthy (label autoheal=true).
  # Docker restart policy на healthcheck не реагирует — этот сайдкар закрывает
  # разрыв: зависший celery-воркер (не отвечает на inspect ping) будет пересоздан.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

  mq-async:
    <<: *django-common
    depends_on: *worker-depends
    environment:
      - UV_NO_SYNC=1
      - PGAPPNAME=grms-mq-async
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
      - CELERY_BROKER_URL=redis://redis-broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-broker:6379/1
      # Bypass pgbouncer: transaction pool mode is incompatible with async long-lived connections
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    command: python apps/core/management/commands/mq_async.py
    tmpfs:
      - /prom_mp
    deploy:
      replicas: 2

  mews-websocket:
    <<: *django-common
    container_name: mews-websocket
    depends_on: *worker-depends
    environment:
      - UV_NO_SYNC=1
      - PGAPPNAME=grms-mews-websocket
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python manage.py mews_websocket
    tmpfs:
      - /prom_mp

  pms-handler:
    <<: *django-common
    container_name: pms-handler
    depends_on: *worker-depends
    environment:
      - UV_NO_SYNC=1
      - PGAPPNAME=grms-pms-handler
      - PROMETHEUS_MULTIPROC_DIR=/prom_mp
    command: python manage.py pms_handler
    tmpfs:
      - /prom_mp

  # ---------------------------------------------------------------------------
  # IOT
  # ---------------------------------------------------------------------------

  mqtt:
    image: registry.gitlab.com/grms1/mqtt-broker
    container_name: mqtt-broker
    hostname: mqtt-broker
    restart: unless-stopped
    ports:
      - "${MQTT_EXTERNAL_PORT:-9000}:9999"
    command: python MqttTransportHandler.py
    volumes:
      - mqtt_logs:/mqtt/logs
    logging: *default-logging
    environment:
      GRMS_PROTOCOL: http
      GRMS_HOST: django
      GRMS_PORT: "8000"
      GRMS_PROTOCOL1: https
      GRMS_HOST1: ${API_VIRTUAL_HOST}
      GRMS_PORT1: "443"
      QUEUE_TYPE: rabbitMQ
      QUEUE_HOST: rabbitmq
      QUEUE_PORT: "5672"
      QUEUE_LOGIN: ${RABBITMQ_DEFAULT_USER}
      QUEUE_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      MAX_LOG_DAYS: "7"
      LOGGING_LEVEL: ${MQTT_LOGGING_LEVEL:-WARNING}
    networks:
      - roomio_net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------

  frontend:
    image: registry.gitlab.com/grms1/grms_front:${FRONT_IMAGE_TAG:-leto}
    container_name: vue
    restart: always
    logging: *default-logging
    expose:
      - "80"
    environment:
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=${FRONTEND_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${FRONTEND_VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - HTTPS_METHOD=noredirect
      - HSTS=off
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - roomio_net

  # ---------------------------------------------------------------------------
  # PROXY
  # ---------------------------------------------------------------------------

  proxy:
    image: nginxproxy/nginx-proxy:1.11.0
    container_name: proxy
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - vhost:/etc/nginx/vhost.d
      - certs:/etc/nginx/certs
      - /run/docker.sock:/tmp/docker.sock:ro
      - static_volume:/app/static/
      - media_volume:/app/media/
      - ./nginx/vhost.d:/etc/nginx/vhost.d:ro
    networks:
      - roomio_net
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  letsencrypt:
    image: nginxproxy/acme-companion:2.5.2
    container_name: letsencrypt
    restart: always
    logging: *default-logging
    environment:
      NGINX_PROXY_CONTAINER: proxy
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - vhost:/etc/nginx/vhost.d
      - certs:/etc/nginx/certs
      - /run/docker.sock:/var/run/docker.sock:ro
      - acme_sh_data:/etc/acme.sh
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - roomio_net
      - proxy_net


# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  pg_data:
  redis_broker_data:
  rabbitmq_data:
  static_volume:
  media_volume:
  mqtt_logs:
  prom_mp:
  backend_venv:
  # nginx-proxy volumes
  acme_sh_data:
  certs:
  dhparam:
  vhost:
  html:

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  roomio_net:
    name: roomio_net
    external: true
  proxy_net:
    name: proxy_net
    external: true

# Single-binary Loki with local filesystem storage: enough for one host's container logs.
# Started with -config.expand-env=true, so ${VAR:-default} below is read from the environment.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-336h}
  # Bursts after a restart (Alloy catching up on container logs) exceed the 4MB/s default.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Lines older than this are rejected; Alloy may replay a little history on first start.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Grafana Logs Drilldown: per-service volume graphs.
  volume_enabled: true

# Grafana Logs Drilldown: the Patterns tab (similar lines grouped into templates).
pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

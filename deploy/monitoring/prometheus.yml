global:
  scrape_interval:     30s
  evaluation_interval: 30s

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: django
    scrape_interval:  30s
    scrape_timeout:   10s
    sample_limit:     50000
    static_configs:
      - targets: [django:8000]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: (offline_gateway_.*|devices_offline_total|django_.*|python_.*|mq_.*|up)
        action: keep

  - job_name: blackbox-login
    metrics_path: /probe
    scrape_interval: 60s
    params:
      module: [login_post]
    static_configs:
      - targets:
          - http://django:8000/api/v1/users/access-token/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Домены берутся из targets/blackbox-https.yml (gitignored)
  # cp targets/blackbox-https.example.yml targets/blackbox-https.yml
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_relaxed]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-https.yml
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

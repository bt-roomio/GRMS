groups:
  - name: gateway_alerts
    interval: 30s
    rules:
      - alert: TenantGatewaysOffline
        expr: devices_offline_total == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tenant {{ $labels.tenant_name }} has offline gateway"
          description: |
            Gateway device offline:
            - Device ID: {{ $labels.device_id }}
            - Tenant:    {{ $labels.tenant_name }}
            - Tenant ID: {{ $labels.tenant_id }}

modules:
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]

  https_relaxed:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      valid_status_codes: [200, 204, 301, 302, 401, 403, 404, 405]

  login_post:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"email":"${BLACKBOX_LOGIN_EMAIL}","password":"${BLACKBOX_LOGIN_PASSWORD}"}'
      valid_status_codes: [200]
      fail_if_body_matches_regexp:
        - '"invalid"'
        - '"Invalid credentials"'
      fail_if_body_not_matches_regexp:
        - '"access"'
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

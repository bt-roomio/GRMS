# =============================================================================
# docker-compose.override.yml — локальная разработка
# =============================================================================
# Применяется АВТОМАТИЧЕСКИ при `docker compose up` (без флагов).
#
# Что добавляет этот файл:
#   - Открытые порты для прямого доступа к UI сервисов
#   - Grafana доступна напрямую без nginx-proxy
# =============================================================================

services:

  # --- Grafana: прямой доступ без proxy ---
  grafana:
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_DOMAIN=localhost

  # --- Alertmanager: прямой доступ для диагностики ---
  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"

  # --- Blackbox: прямой доступ для диагностики ---
  blackbox:
    ports:
      - "127.0.0.1:9115:9115"

  # --- Node exporter: прямой доступ для диагностики ---
  node-exporter:
    ports:
      - "127.0.0.1:9100:9100"

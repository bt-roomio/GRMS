# =============================================================================
# docker-compose.override.yml: local development
# =============================================================================
# Applied AUTOMATICALLY on `docker compose up` (without flags).
#
# What this file adds:
#   - Open ports for direct access to service UIs
#   - Grafana reachable directly without nginx-proxy
# =============================================================================

services:

  # --- Grafana: direct access without proxy ---
  grafana:
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_DOMAIN=localhost

  # --- Alertmanager: direct access for diagnostics ---
  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"

  # --- Blackbox: direct access for diagnostics ---
  blackbox:
    ports:
      - "127.0.0.1:9115:9115"

  # --- Node exporter: direct access for diagnostics ---
  node-exporter:
    ports:
      - "127.0.0.1:9100:9100"
